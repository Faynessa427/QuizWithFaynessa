<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>General Knowledge Quiz</title>
		<link rel="stylesheet" href="takeQuiz.css">
	</head>
	<body>
		<main class="quiz-shell">
			<header class="quiz-header">
				<div>
					<p class="eyebrow">General Knowledge Quiz</p>
					<h1>Can you take the heat?</h1>
				</div>
				<div class="timer-wrap" aria-live="polite">
					<span class="timer-label">Time left</span>
					<span id="timer">00:10</span>
				</div>
			</header>

			<div class="quiz-meta">
				<span id="question-counter">Question 1 of 10</span>
				<span id="score-display">Score: 0</span>
			</div>
			<div class="progress-track" aria-hidden="true">
				<div id="progress-bar"></div>
			</div>

			<section class="question-card" aria-labelledby="question-text">
				<p class="question-number" id="question-number">01</p>
				<h2 id="question-text">Loading question...</h2>
				<div id="options" class="options" role="radiogroup" aria-label="Answer choices"></div>
			</section>

			<nav class="quiz-controls" aria-label="Quiz navigation">
				<button id="quit-button" class="button button-quit" type="button">Quit</button>
				<button id="previous-button" class="button button-secondary" type="button">&larr; Previous</button>
				<button id="next-button" class="button button-primary" type="button" disabled>Next &rarr;</button>
			</nav>
		</main>
	<script src="takeQuiz.js"></script>
	</body>
</html>
